note: 'Derived from the harvested OpenAPI paths and the object identifiers the ConnexPay docs describe. ConnexPay''s core model is a matched pair: an inbound Sale (PayIn) produces an Incoming Transaction Code (ITC) that funds one or more outbound Purchases (PayOuts) — virtual card, ACH or push-to-card. Identifiers are GUIDs.'
