- message: Auth restriction found for given mid or mcc
  meaning: Supplier's MCC or MID not allowed based on card's assigned Purchase Type or other MID rules.
  region: ALL
  surface: payout
- message: Card already in use
  meaning: Multiple authorization attempts made against the card simultaneously.
  region: ALL
  surface: payout
- message: Card is in an expired status
  meaning: Card is in an expired status.
  region: ALL
  surface: payout
- message: Card is not active
  meaning: Authorization attempted prior to the set activation date for the card.
  region: ALL
  surface: payout
- message: Card suspicious - Expiration mismatch
  meaning: Expiration date or other data related to the authorization did not match card details.
  region: ALL
  surface: payout
- message: Card terminated
  meaning: Card is in a terminated status.
  region: ALL
  surface: payout
- message: Card trs no. limit exceeded
  meaning: No remaining authorizations may be attempted based on the set Usage Limit of the card.
  region: ALL
  surface: payout
- message: Do not honor
  meaning: A generic code that could mean the card has insufficient funds, an incorrect expiration date was provided, etc.
  region: ALL
  surface: payout
- message: Exceeds withdrawal amount limit
  meaning: Authorization amount exceeds the available balance of the card.
  region: ALL
  surface: payout
- message: Expired card
  meaning: Card is in an expired status.
  region: ALL
  surface: payout
- message: Isocountry not allowed
  meaning: Supplier's location is a country that has been restricted from authorizations.
  region: ALL
  surface: payout
- message: MCC not allowed
  meaning: Supplier's Merchant Category Code is not allowed based on the program or card configuration.
  region: ALL
  surface: payout
- message: MID Not allowed
  meaning: Supplier's Merchant ID is not allowed based on the program or card configuration.
  region: ALL
  surface: payout
- message: No sufficient funds
  meaning: Authorization amount exceeds the available balance for the card.
  region: ALL
  surface: payout
- message: Transaction not supported
  meaning: Transaction type not allowed by issuing system.
  region: ALL
  surface: payout
- message: Unknown Response Code
  meaning: A system or application error occurred during the processing of the authorization.
  region: ALL
  surface: payout
- message: Unsupported transaction
  meaning: Transaction type not allowed by issuing system.
  region: ALL
  surface: payout
- message: Wrong exp.date
  meaning: Expiration date used in the authorization attempt does not match the expiration date of the card.
  region: ALL
  surface: payout
