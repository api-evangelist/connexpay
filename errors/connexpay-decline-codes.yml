x-evidence:
  fetched: '2026-08-09'
  url: https://docs.connexpay.com/reference/decline-codes
  http_status: 200
summary: ConnexPay publishes processor decline/status codes for its PayIn (Sales) authorization surface, split into three regional tables (US, EU/UK, and Canada by card brand), plus a separate PayOut (virtual-card authorization) decline list for cards ConnexPay itself issues.
surfaces:
- surface: PayIns / Sales authorizations
  docs: https://docs.connexpay.com/reference/decline-codes
  envelope_field: processorStatusCode / processorResponseMessage
  note: Codes are the acquirer/processor response returned on the Sales API authorization result. Risk-related declines configured with Equifax (Kount 360) or another risk provider are excluded from these tables.
- surface: PayOuts / Purchase (virtual card) authorizations
  docs: https://docs.connexpay.com/reference/decline-codes-purchases
  envelope_field: decline message
  note: Declines raised by ConnexPay when a supplier attempts to authorize a virtual card ConnexPay issued.
counts:
  us: 523
  eu_uk: 39
  ca: 113
  payout: 18
