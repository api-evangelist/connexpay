magic_values:
- kind: risk decline trigger
  field: Email
  value: decline@connexpay.com
  effect: 'Sale fails with an authorization decline: "status":"Transaction – Declined". Requires the implementation team to configure the Equifax rules engine for the test environment.'
- kind: CVV mismatch
  field: security code
  effect: Any CVV other than the value published for the test card returns an authorization decline.
- kind: AVS simulation
  field: Zip Code
  effect: Specific zip codes map to specific AddressVerificationCode results in Sandbox.
  docs: https://docs.connexpay.com/docs/status-and-error-codes
  values:
  - zip: '8320'
    code: N
    result: No match.
  - zip: '85284'
    code: Z
    result: Postal/ZIP match, street address does not match or was not included.
  - zip: M4P1Z2
    code: Y
    result: Street address and postal/ZIP match.
  - zip: M4P1Z3
    code: '0'
    result: Unavailable.
  - zip: M11AA
    code: Y
    result: Street address and postal/ZIP match.
  - zip: EC1A1BB
    code: Y
    result: Street address and postal/ZIP match.
  - zip: '99999'
    code: U
    result: Address not verified for domestic transaction.
  - zip: '99998'
    code: G
    result: Address not verified for international transaction.
  - zip: '999970001'
    code: B
    result: Street addresses match, postal/ZIP not verified (incompatible formats).
  - zip: '999970002'
    code: C
    result: Street address and postal/ZIP not verified (incompatible formats).
  - zip: '999970003'
    code: D
    result: Street addresses and postal/ZIP codes match.
validation_scenarios:
- scenario: Sale & Purchase - Basic
  expected: A virtual card corresponding to the ITC returned by the sale is created.
- scenario: Sale - Risk Decline
  expected: Sale fails with an auth decline response.
- scenario: Sale - Declined Authorization
  expected: Non-matching CVV returns an auth decline.
- scenario: Sale - Void
  expected: Sale is voided prior to batch settlement; response includes 201.
- scenario: Purchases - Exceed Virtual Card Issuing Limit
  expected: Issuing more cards than ExpectedPayments fails.
- scenario: Purchases - Exceed Virtual Card Amount Limit
  expected: Issuing a card for more than the authorized sale amount fails.
tooling:
  postman: Developers integrating for the first time receive a set of Postman scripts containing a username, password, merchant ID, device ID and URLs. These are issued privately by the implementation team — ConnexPay does not publish a public Postman workspace.
  console: Bridge UI (Production only) — web tool to submit, view and manage transaction activity and to issue a virtual card outside of an API integration.
  webhook_testing: Sandbox webhook endpoints are self-configured through Bridge; ConnexPay sends a set of simulated API calls so business logic can be validated against real events.
