separation:
  model: separate hosts per environment
  credential_scope: Sandbox credentials do not work in Production; a distinct username, password, merchant ID (MID) and device ID are issued per environment.
  self_service: false
  gate: Production credentials are only issued after the implementation team confirms successful Solution Validation in Sandbox — see the Sandbox Validation scenario list.
  currency: The Sandbox is configured for USD only; other currencies are not supported there and all test transactions display as USD.
  not_supported_in_sandbox:
  - load testing
  - automated batch settlement
  - ATI refresh
  - ATA refresh
  - reconciliation
environments:
- name: Sandbox
  sales_host: https://sandboxsalesapi.connexpay.com
  purchases_host: https://sandboxpurchasesapi.connexpay.com
  payment_valet_host: https://sandbox.api.connexpay.com/valet/payment/v1
- name: Production
  sales_host: https://salesapi.connexpay.com
  purchases_host: https://purchasesapi.connexpay.com
  reporting_host: https://reportingapi.connexpay.com
  chargebacks_host: https://cmsapi.connexpay.com
  bridge_host: https://api.cxpbridge.com
  note: The Reporting API and the UATP / enhanced-travel-data reporting endpoints are documented as Production-only — they are not callable in Sandbox.
