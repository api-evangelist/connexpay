  url: https://docs.connexpay.com/changelog/june-3-2026-v-81100
  highlights:
  - Added Beneficiary Name and Beneficiary Address fields to the Virtual Account Details view in Bridge.
  - Fixed the Transaction Status line on the Payment Link confirmation receipt modal.
  - Improved fuzzy address matching for hotel confirmation to reduce false negatives.
  - Fixed rejection of amountLimit updates on Monavate EUR cards after a settled refund.
  - Resolved a 'CardHolder not found' error in the Update CardHolder Info API.
