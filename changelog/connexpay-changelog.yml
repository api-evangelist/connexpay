- version: 8.15.00
  date: '2026-07-22'
  url: https://docs.connexpay.com/changelog/july-22-2026-v-81500
  breaking: null
  highlights:
  - Enhanced Int'l Bank to Bank Transfer payee security to prevent editing once a payee has been created.
  - Modified the country drop-down on Payment Links to not list US territories as countries.
  - Updated CXP Portal to add a Customer Support Phone Number field.
  - Added support for Apple Pay dual-button functionality at checkout.
  - Corrected Payment Link validation to require all mandatory fields before submission.
- version: 8.14.00
  date: '2026-07-08'
  url: https://docs.connexpay.com/changelog/july-8-2026-v-81400
  highlights:
  - Updated Int'l Bank to Bank Transfer pricing structure.
  - Enhanced reservation communication for the business travel initiative.
  - Corrected an issue displaying decline code '96' for successful authorizations.
- version: 8.13.00
  date: '2026-07-01'
  url: https://docs.connexpay.com/changelog/july-1-2026-v-81300
  highlights:
  - Added a new payout option — Int'l Bank to Bank Transfer — allowing merchants to send funds directly to a recipient's bank account in one of 138 supported foreign currencies.
- version: 8.13.00
