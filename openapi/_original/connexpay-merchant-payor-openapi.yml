      required:
      - payorId
      - payorName
      - accountType
      - accountName
      - accountNumber
      - routingNumber
      type: object
      properties:
        payorId:
          maxLength: 200
          minLength: 0
          pattern: '^[A-Za-z0-9]+(?: +[A-Za-z0-9]+)*$'
          type: string
          description: The ID value to be assigned to the created Payor.
        payorName:
          maxLength: 50
          minLength: 0
          type: string
          description: The Name to be assigned to the created Payor.
        accountType:
          type: string
          description: '''1'' for Checking or ''2'' for Savings account.'
        accountName:
          maxLength: 200
          minLength: 0
          type: string
          description: Name that appears on the bank account.
        accountNumber:
          maxLength: 17
          minLength: 0
          type: string
          description: Numeric bank account number.
        routingNumber:
          maxLength: 9
          minLength: 0
          pattern: ^[0-9]{9}$
          type: string
          description: 9 digit numeric bank routing number.
