openapi: 3.0.0
info:
  version: v1
  title: Purchases API
paths:
  /api/v1/Merchants/{merchantGuid}/Payors:
    post:
      tags:
      - MerchantPayor
      summary: Create merchant payor
      description: Create a payor for a merchant
      operationId: MerchantPayor_CreatePayor
      parameters:
      - name: merchantGuid
        in: path
        description: The client identifier assigned by ConnexPay.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/MerchantPayorDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPayorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/MerchantPayorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/MerchantPayorResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/MerchantPayorResponse'
        '400':
          description: Invalid ModelState
        '403':
          description: User does not have access to merchant.
        '409':
          description: A payor with this payorID already exists
  /api/v1/Merchants/{merchantGuid}/Payors/{payorGuid}:
    get:
      tags:
      - MerchantPayor
      summary: Get Merchant Payor
      description: Get a merchant payor by guid.
      operationId: MerchantPayor_GetPayor
      parameters:
      - name: merchantGuid
        in: path
        description: The client identifier assigned by ConnexPay.
        required: true
        schema:
          type: string
          format: uuid
      - name: payorGuid
        in: path
        description: The guid of the merchant payor to be retrieved.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPayorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/MerchantPayorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/MerchantPayorResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/MerchantPayorResponse'
        '204':
          description: No MerchantPayor found
        '400':
          description: Bad request
        '403':
          description: User does not have access to merchant.
    put:
      tags:
      - MerchantPayor
      summary: Update Merchant Payor
      description: Update a merchant payor by guid.
      operationId: MerchantPayor_UpdatePayor
      parameters:
      - name: merchantGuid
        in: path
        description: The client identifier assigned by ConnexPay.
        required: true
        schema:
          type: string
          format: uuid
      - name: payorGuid
        in: path
        description: The guid of the merchant payor to be updated.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/MerchantPayorDto'
      responses:
        '204':
          description: NoContent
        '400':
          description: Bad request
        '403':
          description: User does not have access to merchant.
        '409':
          description: A payor with this payorID already exists
    delete:
      tags:
      - MerchantPayor
      summary: Delete Merchant Payor
      description: Delete a merchant payor by guid.
      operationId: MerchantPayor_DeletePayor
      parameters:
      - name: merchantGuid
        in: path
        description: The client identifier assigned by ConnexPay.
        required: true
        schema:
          type: string
          format: uuid
      - name: payorGuid
        in: path
        description: The guid of the merchant payor to be deleted.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Merchant Found
        '400':
          description: Bad request
        '403':
          description: User does not have access to merchant.
servers:
- url: https://sandboxpurchasesapi.connexpay.com
components:
  requestBodies:
    MerchantPayorDto:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MerchantPayorDto'
        text/json:
          schema:
            $ref: '#/components/schemas/MerchantPayorDto'
        application/xml:
          schema:
            $ref: '#/components/schemas/MerchantPayorDto'
        text/xml:
          schema:
            $ref: '#/components/schemas/MerchantPayorDto'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/MerchantPayorDto'
      required: true
  schemas:
    MccGroupDto:
      required:
      - name
      - mccArray
      type: object
      properties:
        id:
          format: int32
          type: integer
        guid:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
        mccArray:
          type: string
        holdIncreaseType:
          type: string
        holdIncreaseValue:
          format: double
          type: number
        holdExpirationDays:
          format: int32
          type: integer
        purchaseType:
          type: string
        status:
          type: string
        isGlobal:
          type: boolean
    MerchantPayeeDto:
      required:
      - isBusiness
      - payeeId
      - preferredPayoutMethod
      type: object
      properties:
        idMerchant:
          format: int32
          type: integer
        isBusiness:
          type: boolean
        firstName:
          maxLength: 100
          minLength: 0
          pattern: '^[A-Za-z0-9]+(?: +[A-Za-z0-9]+)*$'
          type: string
        lastName:
          maxLength: 100
          minLength: 0
          pattern: '^[A-Za-z0-9]+(?: +[A-Za-z0-9]+)*$'
          type: string
        dbaName:
          maxLength: 200
          minLength: 0
          type: string
        payeeId:
          maxLength: 100
          minLength: 0
          pattern: ^[a-zA-Z0-9\s!@#$%^&*(),.?":{}|<>]*$
          type: string
        taxId:
          maxLength: 50
          minLength: 0
          pattern: '^[A-Za-z0-9-]+(?: +[A-Za-z0-9-]+)*$'
          type: string
        customerId:
          maxLength: 100
          minLength: 0
          type: string
        email:
          pattern: ^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
          type: string
        address1:
          maxLength: 150
          minLength: 0
          type: string
        address2:
          type: string
        city:
          maxLength: 50
          minLength: 0
          type: string
        state:
          maxLength: 3
          minLength: 0
          type: string
        zip:
          maxLength: 10
          minLength: 0
          type: string
        country:
          pattern: ^[0-9a-zA-Z ]{2,40}$
          type: string
        preferredPayoutMethod:
          type: string
        preferredCardBrand:
          type: string
        preferredCardClass:
          type: string
        purchaseType:
          type: string
        guid:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        timestamp:
          format: date-time
          type: string
        bankAccountNumber:
          type: string
        bankRoutingNumber:
          type: string
        bankAccountType:
          type: string
        confirmBankAccountNumber:
          type: string
        confirmBankRoutingNumber:
          type: string
        taxIdLastFour:
          type: string
        bankAccountNumberLastFour:
          type: string
        bankRoutingNumberLastFour:
          type: string
        confirmBankAccountNumberLastFour:
          type: string
        confirmBankRoutingNumberLastFour:
          type: string
      example:
        idMerchant: 0
        isBusiness: false
        firstName: John
        lastName: Doe
        dbaName: ''
        payeeId: payeeID01
        taxId: 12-3456789
        customerId: customerID01
        email: test@test.com
        address1: 123 Main St
        address2: ''
        city: Anytown
        zip: '12345'
        country: US
        preferredPayoutMethod: VCC
        preferredCardBrand: Visa
        preferredCardClass: CreditCommercial
        purchaseType: '01'
        guid: 00000000-0000-0000-0000-000000000000
        timestamp: '0001-01-01T00:00:00'
    SearchMerchantPayeeDto:
      type: object
      properties:
        searchTerm:
          type: string
      example:
        searchTerm: payeeID01
