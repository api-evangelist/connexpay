    PayeeDto:
      required:
      - merchantGuid
      - firstName
      - lastName
      - email
      - phone
      type: object
      properties:
        payeeGuid:
          format: uuid
          description: Guid for the created Payee that is returned by ConnexPay upon creation of a Payee. Ignored if provided in a Payee creation request.
          type: string
          example: 00000000-0000-0000-0000-000000000000
        merchantGuid:
          format: uuid
          description: Merchant guid for the Payee to be created.
          type: string
          example: 00000000-0000-0000-0000-000000000000
        firstName:
          description: First name for the Payee to be created.
          maxLength: 50
          minLength: 0
          type: string
        lastName:
          description: Last name for the Payee to be created.
          maxLength: 50
          minLength: 0
          type: string
        email:
          description: Email address for the Payee.
          pattern: ^([a-zA-Z0-9_\-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([a-zA-Z0-9\-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$
          type: string
        address1:
          description: Postal address line 1 for the Payee. Alphanumerics and [,.-'] are allowed.
          maxLength: 100
          minLength: 0
          type: string
        address2:
          description: Postal address line 2 for the Payee. Alphanumerics and [,.-'] are allowed.
          maxLength: 100
          minLength: 0
          type: string
        city:
          description: Postal address city for the Payee.
          maxLength: 30
          minLength: 0
          type: string
        state:
          description: Postal address state for the Payee.
          maxLength: 30
          minLength: 0
          type: string
        zipCode:
          description: Postal code for the Payee.
          maxLength: 30
          minLength: 0
          type: string
        phone:
          description: Phone number for the Payee, up to 10-character string.
          pattern: ^\+1\d{10}$
          type: string
        status:
          description: Status for the Payee.
          type: string
        cardId:
          description: Unique identifier that refers to the card saved for a Payee when using the Payment Widget. It will be null when a Payee is created but will have a value once stored for the Payee using the Payment Widget.
          type: string
    UpdatePayeeDto:
