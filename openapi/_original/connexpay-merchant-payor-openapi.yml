    PayoutDto:
      required:
      - merchantGuid
      - memo
      - payments
      type: object
      properties:
        payoutGuid:
          format: uuid
          description: Guid assigned to the Payout by ConnexPay upon creation of a Payout.
          type: string
          example: 00000000-0000-0000-0000-000000000000
        merchantGuid:
          format: uuid
          description: Application-level value that indicates a Payout is being requested for client's account. Value provided by ConnexPay.
          type: string
          example: 00000000-0000-0000-0000-000000000000
        payoutReferenceToken:
          description: The Payout identifier that will be needed by ConnexPay support teams to research issues.
          type: string
