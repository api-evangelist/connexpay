openapi: 3.0.1
info:
  title: ConnexPay Reporting API
  description: REST API for retrieving reporting data. Currently Daily Accounting data only.
  contact:
    name: ConnexPay
    url: https://docs.connexpay.com
  version: v1
paths:
  /api/v1/Accounting/DailyDetail:
    get:
      tags:
      - Accounting
      summary: Get Daily Accounting Detail
      description: 'This endpoint returns the paginated daily accounting detail items of a client for a given release date. For Authentication with this API, you must first obtain a token through https://docs.connexpay.com/reference/reporting-token. This endpoint is only accessible in Production. '
      operationId: GetDetail
      parameters:
      - name: merchantGuid
        in: query
        description: The client identifier for the requested transactions.
        required: true
        schema:
          type: string
          format: uuid
        example: ab0123f5-7648-4e27-8709-ad0f4e162c20
      - name: releasedDate
        in: query
        description: Date on which the requested transactions were released to the client.
        required: true
        schema:
          type: string
          format: date
        example: '2022-12-31'
      - name: pageNumber
        in: query
        description: ''
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: ''
        schema:
          maximum: 25000
          minimum: 1
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Successfully retrieved daily accounting detail data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAccountingDetailPaginatedItems'
        '204':
          description: No Content
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The request was not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No data was found for the provided parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/Accounting/DailySummary:
    get:
      tags:
      - Accounting
      summary: Get Daily Accounting Summary
      description: This endpoint returns the daily accounting summary of a merchant for a given release date. For Authentication with this API, you must first obtain a token through https://docs.connexpay.com/reference/reporting-token. This endpoint is only accessible in Production.
      operationId: GetSummary
      parameters:
      - name: merchantGuid
        in: query
        description: The client identifier for the requested transactions.
        required: true
        schema:
          type: string
          format: uuid
        example: ab0123f5-7648-4e27-8709-ad0f4e162c20
      - name: releasedDate
        in: query
        description: Date on which the requested transactions were released to the client.
        required: true
        schema:
          type: string
          format: date
        example: '2022-12-31'
      responses:
        '200':
          description: Successfully retrieved daily accounting summary data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAccountingSummary'
        '204':
          description: No Content
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The request was not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No data was found for the provided parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/Credit/AvailableCreditReport/{pageNumber}/{pageSize}:
    post:
      tags:
      - Credit
      summary: Get Available Credit Report
      operationId: AvailableCreditReport
      parameters:
      - name: pageNumber
        in: path
        description: ''
        required: true
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: path
        description: ''
        required: true
        schema:
          maximum: 25000
          minimum: 1
          type: integer
          format: int32
          default: 10
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailableCreditReportRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AvailableCreditReportRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AvailableCreditReportRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableCreditReportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/ExtendedData/{pageNumber}/{pageSize}:
    post:
      tags:
      - ExtendedData
      summary: Get Enhanced (Level 2 and Level 3) Travel Data
      description: Retrieves enhanced data for travel-related transactions. This includes airline and hotel details, such as passenger names, flight numbers, hotel charges, etc. The data is paginated and can be filtered by various parameters. For Authentication with this API, you must first obtain a token through https://docs.connexpay.com/reference/reporting-token. This endpoint is only accessible in Production.
      operationId: GetExtendedData
      parameters:
      - name: pageNumber
        in: path
        description: Page number (1-based)
        required: true
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: path
        description: Number of items per page
        required: true
        schema:
          maximum: 25000
          minimum: 1
          type: integer
          format: int32
          default: 10
      requestBody:
        description: Filter parameters for enhanced data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendedDataRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ExtendedDataRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ExtendedDataRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedDataPaginatedItems'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/UATP/Transactions:
    get:
      tags:
      - UATP
      summary: Get UATP Transactions
      description: 'Either postDateFrom and postDateTo OR settledDateFrom and settledDateTo must be provided. (Note: Records will only be returned by the postDateFrom/To range if the transaction has settled.) For Authentication with this API, you must first obtain a token through https://docs.connexpay.com/reference/reporting-token. This endpoint is only accessible in Production.'
      operationId: UATPtransactions
      parameters:
      - name: merchantGuid
        in: query
        description: Unique identifier assigned to the client by ConnexPay.
        required: true
        schema:
          type: string
          format: uuid
      - name: postDateFrom
        in: query
        description: Starting ticket issued date for the transactions to retrieve. Either postDateFrom and postDateTo or settledDateFrom and settledDateTo are required.
        schema:
          type: string
          format: date
      - name: postDateTo
        in: query
        description: Ending ticket issued date for the transactions to retrieve. Either postDateFrom and postDateTo or settledDateFrom and settledDateTo are required.
        schema:
          type: string
          format: date
      - name: settledDateFrom
        in: query
        description: Starting settlement timestamp for the transactions to retrieve. Either postDateFrom and postDateTo or settledDateFrom and settledDateTo are required.
        schema:
          type: string
          format: date
      - name: settledDateTo
        in: query
        description: 'Ending settlement timestamp for the transactions to retrieve. Either postDateFrom and postDateTo or settledDateFrom and settledDateTo are required. '
        schema:
          type: string
          format: date
      - name: pageNumber
        in: query
        description: The page number for the transactions to retrieve in this call.
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: The number of transactions to retrieve in this call.
        schema:
          maximum: 25000
          minimum: 1
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UATPTransactionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AvailableCreditReport:
      type: object
      properties:
        client:
          description: Unique name assigned to the client by ConnexPay.
          type: string
          nullable: true
        mid:
          description: Unique merchant identifier assigned to the client by ConnexPay.
          type: string
          nullable: true
        date:
          description: Date Time.
          type: string
          format: date-time
        type:
          description: Type of the credit transaction.
          type: string
          nullable: true
        user:
          description: User that performed the credit transaction.
          type: string
          nullable: true
        amount:
          description: Amount of the credit transaction.
          type: number
          format: double
        availableCredit:
          description: Available credit amount as a result of the credit transaction.
          type: number
          format: double
        merchantGatewayGuid:
          description: Unique merchant Guid assigned to the client by ConnexPay.
          type: string
          format: uuid
      additionalProperties: false
    AvailableCreditReportRequest:
      type: object
      properties:
        merchantGuid:
          description: Unique identifier assigned to the merchant by ConnexPay.
          type: string
          format: uuid
        client:
          description: Unique name assigned to the client by ConnexPay.
          type: string
          nullable: true
        timeStampFrom:
          description: Start date for the Report Request.
          type: string
          format: date-time
          nullable: true
        timeStampTo:
          description: End date for the Report Request.
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    AvailableCreditReportResponse:
      type: object
      properties:
        pageCurrent:
          description: Current Page number.
          type: integer
          format: int32
        pageCurrentResults:
          description: Current Page results.
          type: integer
          format: int32
        pageSize:
          description: Page size.
          type: integer
          format: int32
        pageTotal:
          description: Total number of pages available.
          type: integer
          format: int32
        totalCount:
          description: Count of all items available.
          type: integer
          format: int32
        searchResults:
          type: array
          items:
            $ref: '#/components/schemas/AvailableCreditReport'
          nullable: true
      additionalProperties: false
    DailyAccountingDetail:
      type: object
      properties:
        merchantGuid:
          type: string
          description: "Merchant Guid\r\n\r\nUnique identifier assigned to the merchant by ConnexPay."
          format: uuid
        clientName:
          type: string
          description: "Client Name\r\n\r\nUnique name assigned to the client by ConnexPay."
          nullable: true
        releasedDate:
          type: string
          description: "Released Date\r\n\r\nDate on which the Accounting File for this detail record was released to the client."
          format: date
        description:
          type: string
          description: "Description\r\n\r\nThe type of transaction being released in this detail record.\r\n\r\nPossible Values:\r\n  ACH Debit Reject\r\n  Bank A ACH Credit Reject\r\n  Credit to Client (Withdrawal from Cash Account)\r\n  Daily Flex Funding\r\n  Debit from Client (Deposit to Cash Account)\r\n  Empty\r\n  Prior Day Cash Balance\r\n  Purchase - ACH Purchase\r\n  Purchase - ACH Return\r\n  Purchase - Push To Card Payout\r\n  Purchase - Virtual Card Chargeback\r\n  Purchase - Virtual Card Purchase\r\n  Purchase - Virtual Card Return\r\n  Reserve Balance\r\n  Sale - ACH Return\r\n  Sale - ACH Sale\r\n  Sale - ACH Void\r\n  Sale - Credit Card Adjustment\r\n  Sale - Credit Card Chargeback\r\n  Sale - Credit Card Return\r\n  Sale - Credit Card Sale\r\n  Sale - Credit Card Void\r\n  Unspecified"
          nullable: true
        orderNumber:
          type: string
          description: "Order Number\r\n\r\nIdentifier that may be provided by the client during the Create Sale or IssueLite process to identify the order.\r\nCan be comprised of multiple sales and purchases."
          nullable: true
        name:
          type: string
          description: "Name\r\n\r\nThe name line 1 and 2 of the virtual credit card."
          nullable: true
        cardLastFour:
          type: string
          description: "Card Last Four\r\n\r\nThe last four digits of the card number associated with the detail record."
          nullable: true
        incomingTransactionCode:
          type: string
          description: "Incoming Transaction Code (ITC)\r\n\r\nA unique ConnexPay generated token that connects an incoming sale transaction to an outbound\r\npurchase (virtual card or ACH) transaction. An ITC is generated and returned for each successful\r\nauthorization associated with a Sale request and is required for each purchase request."
          nullable: true
        customerId:
          type: string
          description: "Customer ID\r\n\r\nIdentifier that may be provided by the client during the Create Sale or IssueLite process. Can be comprised \r\nof multiple sales and purchases. Acts as a secondary identifier in conjunction with OrderNumber."
          nullable: true
        amount:
          type: number
          description: "Amount\r\n\r\nAmount of the sale or purchase transaction."
          format: double
        merchantName:
          type: string
          description: "Merchant Name\r\n\r\nName of the supplier processing the virtual credit card transaction."
          nullable: true
        ticketNumber:
          type: string
          description: "Ticket Number\r\n\r\nAddendum data associated with the transaction that is returned if provided during the virtual credit card or ACH creation"
          nullable: true
        entityGuid:
          type: string
          description: "Entity Guid\r\n\r\nEntity Guid of the detail record to link them back to the original entity."
          format: uuid
          nullable: true
        purchaseType:
          type: string
          description: "Purchase Type\r\n\r\nDescription of the client's category group. Essentially, the industry where the virtual card will be utilized.\r\n\r\nSee the Issue Card method in the Purchases API documentation for more details."
          nullable: true
        entityId:
          type: string
          description: "Entity Id\r\n\r\nEntity Guid of the detail record to link them back to the original entity."
          nullable: true
        issuedAmount:
          type: number
          description: "Issued Amount\r\n\r\nAmount of the virtual credit card issued to the client."
          format: double
        labelName:
          type: string
          description: "Label Name\r\n\r\nComma-separated list of labels associated with the sale."
          nullable: true
        associationId:
          type: string
          description: "Association ID\r\n\r\nUsed to associate a virtual card to one or more sales."
          nullable: true
        saleGuid:
          type: string
          description: "Sale Guid\r\n\r\nGuid value returned from the Create Sale method in the Sales API. Associated with \r\nsale transaction detail records."
          format: uuid
          nullable: true
        cardGuid:
          type: string
          description: "Card Guid\r\n\r\nGuid value return from the Issue Card method in the Purchases API. Associated with \r\npurchase and return detail records."
          format: uuid
          nullable: true
        dateTime:
          type: string
          description: "Date Time\r\n\r\nFor Sale detail records, the date of the sale transaction.\r\n\r\nFor Purchase and Return detail records, the date of the purchase or return settlement.\r\n\r\nNote: This date may not be the same as ReleasedDate because release does not occur on weekends and bank holidays."
          format: date-time
          nullable: true
      additionalProperties: false
    DailyAccountingDetailPaginatedItems:
      type: object
      properties:
        totalItemCount:
          type: integer
          description: Count of all items available in the day's accounting detail.
          format: int32
        pageCount:
          type: integer
          description: Count of pages available in the day's accounting detail.
          format: int32
        pageItemCount:
          type: integer
          description: Count of items in the current page.
          format: int32
        pageNumber:
          type: integer
          description: Sequence number of the current page.
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/DailyAccountingDetail'
          description: Collection of accounting detail items for the current page.
          nullable: true
      additionalProperties: false
    DailyAccountingSummary:
      type: object
      properties:
        merchantGuid:
          type: string
          description: "Merchant Guid\r\n\r\nUnique identifier assigned to the merchant by ConnexPay."
          format: uuid
        clientName:
          type: string
          description: "Client Name\r\n\r\nUnique name assigned to the client by ConnexPay."
          nullable: true
        releasedDate:
          type: string
          description: "Released Date\r\n\r\nDate on which the requested transactions were released to the client."
          format: date
        priorDayCashBalance:
          type: number
          description: "Prior Day Cash Balance\r\n\r\nThe starting cash balance from the previous day."
          format: double
        wireAchToFundCashAmount:
          type: number
          description: "Wire/ACH to Fund Cash Account Amount (Credit) or Withdraw from Cash Account Amount (Debit)\r\n\r\nFunds transferred between the client's bank account and ConnexPay to fund transactions or to return funds to the client."
          format: double
        beginningCashBalance:
          type: number
          description: "Beginning Cash Balance\r\n\r\nThe funds the client begins the day with."
          format: double
        creditSaleAmount:
          type: number
          description: "Credit Card Sale Amount (Credit)\r\n\r\nTotal amount of incoming credit card sales added to the client's cash balance."
          format: double
        achSaleAmount:
          type: number
          description: "ACH Sale Amount (Credit)\r\n\r\nTotal amount of incoming ACH sales added to the client's cash balance."
          format: double
        purchaseAchAmount:
          type: number
          description: "ACH Purchase Amount (Debit)\r\n\r\nTotal amount of ACH purchases decreasing the client's cash balance."
          format: double
        purchaseCardAmount:
          type: number
          description: "Virtual Card Purchase Amount (Debit)\r\n\r\nTotal amount of issued virtual credit card purchases subtracting from the client's cash balance."
          format: double
        purchasePushToCardAmount:
          type: number
          description: "Purchase Push to Card Amount\r\n\r\nTotal amount of funds paid out through PushToCard subtracting from the client's cash balance."
          format: double
        creditVoidAmount:
          type: number
          description: "Credit Card Void Amount (Debit)\r\n\r\nTotal amount of credit card sales voided subtracting from the client's cash balance."
          format: double
        creditReturnAmount:
          type: number
          description: "Credit Card Return Amount (Debit)\r\n\r\nTotal amount of credit card sales returned subtracting from the client's cash balance."
          format: double
        creditChargebackAmount:
          type: number
          description: "Credit Chargeback Amount\r\n\r\nTotal amount of Chargebacks received on the credit card sales subtracting from the client's cash balance."
          format: double
        creditAdjustmentAmount:
          type: number
          description: "Credit Adjustment Amount\r\n\r\nTotal amount of manual credit adjustments created for the client."
          format: double
        achVoidAmount:
          type: number
          description: "ACH Void Amount (Debit)\r\n\r\nTotal amount of ACH sales voided subtracting from the client's cash balance."
          format: double
        achReturnAmount:
          type: number
          description: "ACH Return (Debit)\r\n\r\nTotal amount of ACH sales returned subtracting from the client's cash balance."
          format: double
        purchaseCardReturnAmount:
          type: number
          description: "Virtual Card Return Amount (Credit)\r\n\r\nTotal amount returned to issued virtual credit cards adding to the client's cash balance."
          format: double
        purchaseCardChargebackAmount:
          type: number
          description: "Purchase Card Chargeback Amount\r\n\r\nTotal amount of Chargebacks received on issued virtual credit cards as part of the dispute process."
          format: double
        purchaseAchReturnAmount:
          type: number
          description: "Purchase - ACH Return Amount (Credit)\r\n\r\nTotal amount returned to issued ACHs adding to the client's cash balance."
          format: double
        totalActivity:
          type: number
          description: "Total Activity\r\n\r\nThe sum of all debits and credits processed on the client's behalf for the previous day."
          format: double
        newCashBalance:
          type: number
          description: "New Cash Balance\r\n\r\nReflects the day's beginning cash balance plus or minus the client's total activity."
          format: double
        netDebitCreditToClient:
          type: number
          description: "Credit/Debit\r\n\r\nThe amount to be credited to or debited from the client's bank account. ConnexPay will collaborate with\r\nthe client to determine the percentage that will be returned to the client's bank account each day."
          format: double
        endingCashBalance:
          type: number
          description: "Ending Cash Balance\r\n\r\nThe client's New Cash Balance plus or minus the Credit/Debit amount."
          format: double
        minimumCashBalance:
          type: number
          description: "Minimum Cash Balance (MCB)\r\n\r\nMinimum funding balance that should be maintained by the client with ConnexPay."
          format: double
        achDebitRejectAmount:
          type: number
          description: "ACH Debit Reject Amount (Credit)\r\n\r\nTotal amount of payments that did not clear the supplier's account. Payments can be rejected for a variety of reasons, including closed accounts, incorrect account numbers, etc."
          format: double
        directSaleAmount:
          type: number
          description: "Sale - Direct Sale (Credit)\r\n\r\nTotal amount of payments processed between ConnexPay clients through ConnexPay systems using Direct rails, which increases the client's Sales Allowance for future purchases."
          format: double
        directReturnAmount:
          type: number
          description: "Sale - Direct Return (Debit)\r\n\r\nTotal amount of funds refunded after a Direct Sale has been processed and needs to be reversed."
          format: double
        directVoidAmount:
          type: number
          description: "Sale - Direct Void (Debit)\r\n\r\nTotal amount of a Direct Sale transaction that is effectively canceled, with no funds being transferred between the involved parties."
          format: double
        purchaseDirectAmount:
          type: number
          description: "Purchase - Direct Purchase (Debit)\r\n\r\nTotal amount of payments made between ConnexPay clients through ConnexPay systems using the Direct rails."
          format: double
        purchaseDirectReturnAmount:
          type: number
          description: "Purchase - Direct Return (Credit)\r\n\r\nTotal amount of funds returned by a payee on a previously completed Direct Sale."
          format: double
      additionalProperties: false
    ExtendedData:
      type: object
      properties:
        fileName:
          type: string
          nullable: true
        lineNumber:
          type: integer
          format: int64
          nullable: true
        idSettlement:
          type: integer
          format: int32
          nullable: true
          description: A generated unique identifier that can be linked to the EntityId in your Daily Accounting File for settlements.
        passengerName:
          type: string
          nullable: true
          description: Airline related. Name of passenger.
        ticketNumber:
          type: string
          nullable: true
          description: Airline related. Ticket number
        departureDate:
          type: string
          format: date
          nullable: true
          description: Airline related. Date of passenger's departure
        originationCityAirportCode:
          type: string
          nullable: true
          description: Airline related. Code indicating the city and/or airport where the trip originates.
        flightNumberLeg1:
          type: string
          nullable: true
          description: Airline related. Number of the airline flight to be taken on Leg 1 of the trip.
        tripLeg1CarrierCode:
          type: string
          nullable: true
          description: Airline related. Code indicating name of carrier (United Airlines, Jet Blue, etc.).
        tripLeg1ServiceClass:
          type: string
          nullable: true
          description: Airline related. Indicates service class (first class, business class, etc.)
        tripLeg1StopOverCode:
          type: string
          nullable: true
          description: Airline related. Indicates whether a stopover is allowed on this ticket.
        tripLeg1DestinationAirportCode:
          type: string
          nullable: true
          description: Airline related. Indicates destination city's airport code.
        fareBasisCodeLeg1:
          type: string
          nullable: true
          description: Airline related. Fare basis code used for Leg 1 of the trip.
        flightNumberLeg2:
          type: string
          nullable: true
          description: Airline related. Number of the airline flight to be taken on Leg 2 of the trip.
        tripLeg2CarrierCode:
          type: string
          nullable: true
          description: Airline related. Code indicating name of carrier (United Airlines, Jet Blue, etc.).
        tripLeg2ServiceClass:
          type: string
          nullable: true
          description: Airline related. Indicates service class (first class, business class, etc.)
        tripLeg2StopOverCode:
          type: string
          nullable: true
          description: Airline related. Indicates whether a stopover is allowed on this ticket.
        tripLeg2DestinationAirportCode:
          type: string
          nullable: true
          description: Airline related. Indicates destination city's airport code.
        fareBasisCodeLeg2:
          type: string
          nullable: true
          description: Airline related. Fare basis code used for Leg 2 of the trip.
        flightNumberLeg3:
          type: string
          nullable: true
          description: Airline related. Number of the airline flight to be taken on Leg 3 of the trip.
        tripLeg3CarrierCode:
          type: string
          nullable: true
