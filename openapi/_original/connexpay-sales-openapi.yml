  /api/v1/returns/CreateCredit:
    post:
      summary: Create Credit
      description: This Endpoint allows you to create a credit to your consumer without having an associated sale.
      operationId: create-credit
      parameters:
      - name: Content-Type
        in: header
        description: Content-Type Header
        schema:
          type: string
          default: '"application/json"'
