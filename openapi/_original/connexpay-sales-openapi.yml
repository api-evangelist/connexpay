                  timeStamp:
                    type: string
                    example: '2023-08-16T16:40:29.6401705Z'
                  deviceGuid:
                    type: string
                    example: e639a1dc-5cc4-43de-ab74-d5bea6c6b107
                  amount:
                    type: integer
                    example: 0
