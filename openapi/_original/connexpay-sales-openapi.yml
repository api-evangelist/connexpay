  /api/v1/returns:
    post:
      summary: Return
      description: ''
      operationId: return
      parameters:
      - name: Content-Type
        in: header
        description: Content-Type Header
        schema:
          type: string
          default: '"application/json"'
      - name: Authorization
        in: header
        description: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
        schema:
          type: string
          default: Bearer Token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - DeviceGuid
              - Amount
              properties:
                DeviceGuid:
                  type: string
                  description: Device's Guid
                SaleGuid:
                  type: string
                  description: Mandatory when SaleReferenceNumber field is not sent. Sale's Guid.
                SaleReferenceNumber:
                  type: integer
                  description: Mandatory when SaleGuid field is not sent. Sale's Reference Number
                  format: int32
                Amount:
                  type: number
                  description: 'Transaction’s amount. Min. amt.: $0.50'
                  format: float
                SequenceNumber:
                  type: string
                  description: 'Transaction sequence number within client environment. Provide a unique SequenceNumber for each new request. If the same value is sent within 30 minutes it will be considered a duplicate request. Note: value is not searchable or reportable in ConnexPay portal.  The maximum length is 100 alpha-numeric characters.'
                ReturnRetryCard:
                  type: object
                  description: Card data to be used in the event a sale return to the original card is declined and a retry to a new card should be attempted. This attempt needs to be made within 7 days of the failed return authorization
                  properties:
                    CardNumber:
                      type: string
                      description: Card number. Must be 16 characters.
                    CardHolderName:
                      type: string
                      description: Cardholder's name
                    Cvv2:
                      type: integer
                      description: The three or four digit CVV code at the back side of the credit and debit card
                      format: int32
                    ExpirationDate:
                      type: string
                      description: Card's expiry date in the YYMM format
                      format: date
                OrderNumber:
                  type: string
                  description: 'A value that is commonly used for reporting on and reconciling your PayIns and PayOuts. The Order Number is searchable in the ConnexPay Bridge and referenced in Analytics and reporting, and can be any identifier within your environment to associate with the sale or payment, such as a Record Locator, PNR, or transaction ID. The maximum length is 50 alpha-numeric characters and allows the following special characters: [._ /- ].'
