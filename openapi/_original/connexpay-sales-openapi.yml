  /api/v1/Search/Sales/{exportable}/{pageNumber}/{pageSize}:
    post:
      summary: Search sales
      description: This endpoint searches sales.
      operationId: search-sales
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
          default: '"application/json"'
      - name: Authorization
        in: header
        schema:
          type: string
          default: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
      - name: Exportable
        in: path
        description: True or False. It means if you want results exportable to CSV.
        schema:
          type: string
          default: Mandatory
        required: true
      - name: PageNumber
        in: path
        description: Int. Number of page of the results. Default is 1 (Page size default is 500).
        schema:
          type: integer
          format: int32
          default: null
        required: true
      - name: PageSize
        in: path
        description: Int. Size of each page of the results. Default is 500.
        schema:
          type: string
          default: Optional
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                MerchantGuid:
                  type: string
                  description: Merchant’s Guid.
                  default: Mandatory
                AmountFrom:
                  type: number
                  description: 'Amount of the transaction. Min. amt.: $0.50'
                  default: null
                  format: float
                AmountTo:
                  type: number
                  description: 'Amount of the transaction. Min. amt.: $0.50'
                  default: null
                  format: float
                CardHolderName:
                  type: string
                  description: Cardholder’s name.
                  default: Optional
                CardLastFour:
                  type: string
                  description: Card last four number.
                  default: Optional
                CardType:
                  type: string
                  description: Card type.
                  default: Optional
                InvoiceNumber:
                  type: integer
                  description: Sale’s InvoiceNumber.
                  default: null
                  format: int32
                OrderNumber:
                  type: string
                  description: Sale’s order number. Length = 17.
                  default: Optional
                OrderDateFrom:
                  type: string
                  description: Sale’s order Date.
                  default: Optional
                  format: date
                OrderDateTo:
                  type: string
                  description: Sale’s order Date.
                  default: Optional
                  format: date
                TimeStampFrom:
                  type: string
                  description: Sale’s TimeStamp.
                  default: Optional
                  format: date
                TimeStampTo:
                  type: string
                  description: Sale’s TimeStamp.
                  default: Optional
                  format: date
                Status:
                  type: string
                  description: 'Sale’s status. Allowed values:  1. Transaction - Approved 2. Transaction - Declined 3. Transaction - Created - Local 4. Transaction - Created - Error: Processor not reached 5. Transaction - Processor Error 6. Transaction - Approved - Warning'
                  default: Optional
                MerchantCustomerId:
                  type: string
                  description: Merchant Customer Id.
                  default: Optional
                Activated:
                  type: boolean
                  description: Delayed Activation Sales to be included or not
                  default: false
                ActivationDateFrom:
                  type: string
                  description: Activation Start Date. This field is applicable only when Activated flag is set to true.
                  default: Optional
                  format: date
                ActivationDateTo:
                  type: string
                  description: Activation End Date. This field is applicable only when Activated flag is set to true.
                  default: Optional
                  format: date
            examples:
              Example Request:
                value:
                  merchantGuid: 19344275-985e-4dff-81ee-cb84b8ad356c
                  status: Transaction - Approved
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"pageCurrent\": 1,\n    \"pageCurrentResults\": 1,\n    \"pageTotal\": 1,\n    \"pageSize\": 1,\n    \"totalResults\": 1,\n    \"cardSummary\": null,\n    \"searchResultDTO\": [\n        {\n            \"status\": \"Transaction - Approved\",\n            \"amount\": 1,\n            \"card\": {\n                \"cardHolderName\": null,\n                \"cardType\": \"Visa\",\n                \"last4\": \"0473\"\n            },\n            \"orderNumber\": null,\n            \"orderDate\": null,\n            \"timeStamp\": \"2018-11-23T14:57:43.78-03:00\",\n            \"customerID\": null,\n            \"processorResponseMessage\": null,\n            \"effectiveAmount\": 0,\n            \"batchStatus\": \"Batch - Open\",\n            \"relatedVoid\": null,\n            \"relatedReturns\": null,\n            \"guid\": \"d38a9133-6643-4a0a-9675-3cd820a8b5ff\",\n            \"deviceGuid\": \"8ec1c40b-0c00-4a57-a9c7-7800bd52c308\",\n            \"captureGuid\": null,\n            \"customData\": null,\n            \"generatedByCapture\": false,\n            \"partiallyApprovedAmount\": null,\n            \"type\": \"Credit\",\n            \"surcharge\": null,\n            \"surchargeType\": null,\n            \"serviceFee\": null,\n            \"tipAmount\": null,\n            \"cardDataSource\": \"INTERNET\",\n            \"allowCardEmv\": true,\n            \"incomingTransactionCode\": \"09ZZZTAS37411231800000100\",\n            \"activationDate\": \"2021-10-10T00:00:00\"\n        }\n    ]\n}\n"
              schema:
                type: object
                properties:
                  pageCurrent:
                    type: integer
                    example: 1
                    default: 0
                  pageCurrentResults:
                    type: integer
                    example: 1
                    default: 0
                  pageTotal:
                    type: integer
                    example: 1
                    default: 0
                  pageSize:
                    type: integer
                    example: 1
                    default: 0
