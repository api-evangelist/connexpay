  /api/v1/PhysicalCard/{cardGuid}:
    put:
      summary: Copy of Issue Physical Card
      description: Use this endpoint to create a Physical Card. Issuing Physical Cards requires approval and set up. Please contact your Client Success representative if you're interested in learning more.
      operationId: post_apiv1IssueCardPhysicalCard-2
      parameters:
      - name: Content-Type
        in: header
        description: '"application/json"'
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
        schema:
          type: string
      - in: path
        name: cardGuid
        schema:
          type: string
        required: true
        description: Global Unique Identifier of the Physical Card to be updated.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                FirstName:
                  type: string
                  description: Cardholder's first name. Updating this field and setting Reissue=true will issue a new card using the updated name field; it is the cardholder's responsibility to destroy the prior card as well. This is the last name placed on the physical card and the value is also searchable in Bridge. The total length of the combined FirstName and LastName fields cannot exceed 25 characters.
                LastName:
                  type: string
                  description: Cardholder's last name. Updating this field and setting Reissue=true will issue a new card using the updated name field; it is the cardholder's responsibility to destroy the prior card as well. This is the last name placed on the physical card and the value is also searchable in Bridge. The total length of the combined FirstName and LastName fields cannot exceed 25 characters.
                Phone:
                  type: integer
                  description: Cardholder's phone number.  Phone number up to 20 character string.
                  format: int32
                Address1:
                  type: string
                  description: Cardholder's address line 1.  Alphanumeric.
                Address2:
                  type: string
                  description: Cardholder's address line 2.  Alphanumeric.
                City:
                  type: string
                  description: Cardholder's city.
                State:
                  type: string
                  description: Cardholder's short name state.  The ISO 3166-2 CA and US state or province code of a user. Length = 2. If a non U.S. or Canadian value is submitted the card request will not be processed and an error response returned.
                Country:
                  type: string
                  description: Cardholder's country.  Only alpha-2 digit country code allowed and numbers are not allowed.  See ISO-3166 country list of Alpha-2 country codes (https://www.iso.org/obp/ui/) .
                ZipCode:
                  type: string
                  description: Cardholder's zipcode.  The Zipcode must be between 1 and 10 characters long, only numbers and letters are allowed.
                AmountLimit:
                  type: number
                  description: 'Security Control: Maximum dollar amount the card can be authorized and settled, which must be less than or equal to $4,999,999.99. The value must incorporate any anticipated overages such as currency conversion or taxes that a supplier may associate with the transaction. Once the amount limit has been reached, any future authorizations will be declined.'
                  format: float
                UsageLimit:
                  type: integer
                  description: 'Security Control: Maximum number of times the card may be authorized. If you do not provide a usage limit, the card will be considered unlimited.'
                  format: int64
                LimitWindow:
                  type: string
                  description: 'Time period for the spending limits. Valid values: ''Daily'', ''Weekly'', and ''Monthly''. Defines how the amountLimit and usageLimit are reset.'
                  enum:
                  - Daily
                  - Weekly
                  - Monthly
                PurchaseType:
                  type: string
                  description: 'Security Control: The industry where the virtual card will be utilized. For example, if value set to airline and the card is used at hotel, it will be declined. Available purchase type values are: ''01'' (Airline), ''02'' (Hotels and Resorts), ''03'' (Car Rental), ''04'' (Cable, Satellite, Television, and Radio Services), ''05'' (Cruise Lines), ''06'' (Travel), ''11'' (Medical Services and Health Practitioners), ''21'' (Advertising Services), ''22'' (Misc Advertising and Business Services), ''23'' (Ticketing), ''31'' (Insurance Sales, Underwriting, and Premiums), ''32'' (Insurance and Real Estate Codes), ''91'' (Restaurants and Food Services), and ''93'' (Tax Payments). Required if MidWhitelist not provided.'
                AvsCheck:
                  type: boolean
                  description: Enable Address Verification System (AVS) check. When enabled, the address must match the billing address for authorization.
                TerminateDate:
                  type: string
                  description: 'Date when the card should be automatically terminated. Cannot be set to a date beyond one year from current date. Format: ISO 8601.'
                  format: date-time
                Activated:
                  type: boolean
                  description: Indicate whether the card should be in an activated state.
                OrderNumber:
                  type: string
                  description: 'A value that is commonly used for reporting on and reconciling your PayIns and PayOuts. The Order Number is searchable in the ConnexPay Bridge and referenced in Analytics and reporting, and can be any identifier within your environment to associate with the sale or payment, such as a Record Locator, PNR, or transaction ID. The maximum length is 50 alpha-numeric characters and allows the following special characters: [._ /- ].'
                CustomerID:
                  type: string
                  description: 'Transaction ID within client environment associated with the customer. This value acts as a secondary identifier in conjunction with OrderNumber. The value is searchable and reportable in the ConnexPay portal. This value may be sent in multiple times within the integration for multiple purposes. The maximum length is 100 alphanumeric characters and the following special characters: [@._/-]. The maximum length is 50 characters and is alpha-numeric.'
                MidWhitelist:
                  type: string
                  description: List of Merchant IDs (MIDs) that are allowed. Only transactions at these merchants will be authorized. Required if PurchaseType not provided.
                MidBlacklist:
                  type: string
                  description: List of Merchant IDs (MIDs) that are blocked. Transactions at these merchants will be declined.
                reissueCard:
                  type: boolean
                  description: Indicate whether the card should be reissued.
            examples:
              Issue Physical Card Request Example:
                value:
                  MerchantGuid: '{{Merchant}}'
                  FirstName: Test
                  LastName: User
                  DateOfBirth: 01-01-1990
                  PurchaseType: ''
                  TerminateDate: '2027-10-26'
                  AmountLimit: 5.03
                  LimitWindow: DAY
                  UsageLimit: 2
                  OrderNumber: Test-Physical-Card
                  LabelIds:
                  - 124996
                  Address1: 1st Street
                  Address2: Unit 29
                  Country: US
                  State: GA
                  City: Alpharetta
                  Zipcode: '30022'
                  Phone: '3121231234'
                  MIDWhitelist:
                  - '675957401524052'
                  MIDBlacklist:
                  - '670414901524053'
                  PhysicalCardFulfillment:
                    NameLine1: Shawn
                    NameLine2: Test
                    ShippingMethod: USPSPri
                    PhysicalCardShipping:
                      FirstName: Pat
                      LastName: Card
                      Address1: 1st Street
                      Address2: Apt S
                      Country: US
                      State: GA
                      City: Abville
                      Zipcode: '12345'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Issue Physical Card Response Example:
