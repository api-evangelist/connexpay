                    FaxFrom: Example Corporation
      responses:
        '200':
          description: '200'
          content:
            application/json: {}
        '201':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Issue Card Response:
                  summary: Issue Card Response
                  value:
                    cardHolder:
                      cardHolderGuid: a2b25172-c863-4325-b3b9-7e33cff2f8d1
                      firstName: Adam
                      lastName: Smith
                      phone: '7411237489'
                      address1: 345 Main Road
                      address2: ''
                      city: Miami Beach
                      state: MI
                      zipcode: '33109'
