    put:
      summary: Update Virtual Card with Delayed Activation
      description: Request this endpoint to update the activation date or card limit of a virtual card with a future activation date.
      operationId: update-delayed-card
      parameters:
      - name: CardGuid
        in: path
        description: Global Unique Identifier for the Card.
        schema:
          type: string
        required: true
      - name: Content-Type
        in: header
        description: Content-Type Header
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - MerchantGuid
              properties:
                MerchantGuid:
                  type: string
                  description: Merchant's guid. Application level value that indicates a virtual card is being requested for clients account. Value provided by ConnexPay.
                ActivationDate:
                  type: string
                  description: Provide a future date, up to 36 months, if you wish to update the virtual card's activation date. Otherwise leave blank.
                  format: date
                AmountLimit:
                  type: number
                  description: Provide a card amount if you wish to update the amount limit for the virtual card, otherwise leave blank.
                  format: float
                TerminateDate:
                  type: string
                  description: The TerminateDate (YYYY-MM-DD format) is the date the Virtual Credit Card will be terminated by ConnexPay. TerminateDate is different than ExpirationDate in that TerminateDate indicates the actual date the card will no longer be active.  ExpirationDate is the month and year that will be applied to the actual VCC. The recommendation is to set the ExpirationDate one or two years in the future and set the TerminateDate just a day or two after the VCC is expected to be processed. Note, Returns can still be processed on terminated VCCs.
                  format: date
