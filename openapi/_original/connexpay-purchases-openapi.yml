    put:
      summary: Update Lodged Card
      description: ''
      operationId: update-lodged-card
      parameters:
      - name: CardGuid
        in: path
        description: Global Unique Identifier for the Card.
        schema:
          type: string
        required: true
      - name: Content-Type
        in: header
        description: Content-Type Header
        schema:
          type: string
          default: '"application/json"'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                UsageLimit:
                  type: integer
                  description: 'Security Control: Maximum number of times the card may be authorized. This is used in conjunction with the Limit Window; for example, if you specify a Usage Limit of 4 and a Limit Window of Monthly, the card can be authorized up to 4 times per month. The maximum allowed field value is 99, and if you do not provide a value the card will be considered unlimited. Authorization attempts exceeding the provided value will be declined.'
                  format: int64
                AmountLimit:
                  type: number
                  description: 'Security Control: Maximum dollar amount the card can be authorized and settled, which must be less than or equal to $5,000,000.00 (750,000CAD for Canadian Issuing clients). The value must incorporate any anticipated overages such as currency conversion or taxes that a supplier may associate with the transaction. If a supplier attempts to authorize a card for more than the amount limit it will be declined.'
                  format: float
                LimitWindow:
                  type: string
                  description: 'This is the time period that both the UsageLimit and the AmountLimit applies. Options are: Day, Week, Month, Lifetime. For example AmountLimit is $500 and LimitWindow is "Week" then the card can be approved for $500 per week.'
                PurchaseType:
                  type: string
                  description: 'Security Control: The industry(s) where a virtual card can be used. For example, if value is set to 01 Airline and the card is attempted to be used at a hotel, it will decline. Allowed purchase types are decided during underwriting. Ask a ConnexPay team member for Purchase Types enabled on your account. Best Practice is to always assign a Purchase Type that is restrictive as possible.'
                Activated:
                  type: boolean
                  description: True activates a lodged card. False suspends a lodged card.
                AssociationId:
                  type: string
                  description: 'Utilize the Association ID field to tie a lodged card to a sale or sales. For example, if you have several sales and one lodged card payment to a supplier, you can add association ID to the sales and the lodged card for downstream reporting. The maximum length is 100 alphanumeric characters and the following special characters: [@._/-].'
                TerminateDate:
                  type: string
