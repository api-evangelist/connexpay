  /api/v1/Addendum/VirtualCard:
    post:
      summary: Virtual Card Addendum
      description: ''
      operationId: virtual-card-addendum
      parameters:
      - name: Content-Type
        in: header
        description: '"application/json"'
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ItemGuid:
                  type: string
                  description: Guid for the Virtual Card you are attaching information to with this addendum request. This Guid was returned to client when the Virtual Card was initially created.
                  default: Mandatory
                Value:
                  type: string
                  description: Character data to associate with the Virtual card.
                  default: Mandatory
                Category:
                  type: string
                  description: Can be used by client to specify a desired category for an Addenda item.
                  default: Optional
                IdExternal:
                  type: string
                  description: Can be supplied by client to associate this addendum with an ID in client's data.
                  default: Optional
                Note:
                  type: string
                  description: Additional information to associate with this addendum, as desired.
                  default: Optional
                Sequence:
                  type: string
                  description: If client creates multiple addenda for a single Virtual Card this sequence can be specified if a client desires.
                  default: Optional
            examples:
              Addendum Request:
                value:
                  itemGuid: 2b586234-7f14-432e-b0f4-a2935f783f38
                  value: 5AH6FT
                  category: PNR
                  idExternal: '299'
