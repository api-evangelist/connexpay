  /api/v1/Merchants/{merchantGuid}/UserDefinedParameterDefinition:
    post:
      summary: Create User Defined Parameter
      description: Use this endpoint to create User Defined Parameters to associate with your PayOuts.
      operationId: create-user-defined-parameter
      parameters:
      - name: Content-Type
        in: header
        description: '"application/json"'
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
        schema:
          type: string
      - name: merchantGuid
        in: path
        description: The client identifier assigned by ConnexPay.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - idDataType
              properties:
                name:
                  type: string
                  description: Required field defining the name of the User Defined Parameter being created. Alphanumerics and special characters are allowed.
                idDataType:
                  type: integer
                  description: 'Required field defining the data type of the User Defined Parameter being created. Allowed values and corresponding definition are as follows: 1 = Integer, 2 = Decimal, 3 = String, 4 = DataTime.'
                  format: int32
                maxLength:
                  type: integer
                  description: Field defining the maximum length allowed for the created User Defined Parameter. Required when the idDataType is String and the value must be an integer between 1 and 100.
                  format: int32
                IsFilterable:
                  type: boolean
                  description: Field to determine if the User Defined Parameter being created will be filterable in the PayIns & PayOuts table in ConnexPay Bridge.
                  default: 'false'
            examples:
              Create User Defined Parameter Example:
                value:
                  name: User Defined Parameter
                  idDataType: 3
                  maxLength: 100
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Created:
                  value: "{\n  \"idUserDefinedParameterDefinition\": 0,\n  \"idMerchant\": 0,\n  \"name\": \"User Defined Parameter\",\n  \"idDataType\": 3,\n  \"maxLength\": 100,\n  \"guid\": \"00000000-0000-0000-0000-000000000000\",\n  \"isDeleted\": false\n}"
              schema:
                type: object
                properties:
                  idUserDefinedParameterDefinition:
                    type: integer
                    example: 0
                    default: 0
                  idMerchant:
                    type: integer
                    example: 0
                    default: 0
                  name:
                    type: string
                    example: User Defined Parameter
                  idDataType:
                    type: integer
                    example: 3
                    default: 0
                  maxLength:
                    type: integer
                    example: 100
                    default: 0
                  guid:
                    type: string
                    example: 00000000-0000-0000-0000-000000000000
                  isDeleted:
                    type: boolean
                    example: false
                    default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Bad Request - Invalid value for DateType or Max Length must be between 1 and 100:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Forbidden - User does not have access to this merchant:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '409':
          description: '409'
          content:
            application/json:
              examples:
                Conflict - A User Defined param definition with this Name already exists:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
