                          accountType:
                            type: string
                            example: Checking
                          accountHolderName:
                            type: string
                            example: PR123
                          last4Digits:
                            type: string
                            example: '2333'
                  userName:
                    type: string
                    example: test-user
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
