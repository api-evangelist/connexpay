  /api/v1/Addendum/ACH:
    post:
      summary: ACH Purchase Addendum
      description: ''
      operationId: ach-purchase-addendum
      parameters:
      - name: Content-Type
        in: header
        description: '"application/json"'
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ItemGuid:
                  type: string
                  description: Guid for the ACH Purchase you are attaching information to with this addendum request. This Guid was returned to client when the ACH Purchase was initially created.
                  default: Mandatory
                Value:
                  type: string
                  description: Character data to associate with the Virtual card.
                  default: Mandatory
                Category:
                  type: string
                  description: Can be used by client to specify a desired category for an Addenda item. Consistent category parameters will aid in reporting consistently. See note below regarding the "MultipleSales" category and how to use the category specifically to associate an ACH Purchase to an existing sale(s).
                  default: Optional
                IdExternal:
                  type: string
                  description: Can be supplied by client to associate this addendum with an ID in client's data.
                  default: Optional
                Note:
                  type: string
                  description: Additional information to associate with this addendum, as desired.
                  default: Optional
                Sequence:
                  type: string
                  description: If client creates multiple addenda for a single ACH Purchase this sequence can be specified if a client desires.
                  default: Optional
            examples:
              Addendum Request:
                value:
                  itemGuid: 2b586234-7f14-432e-b0f4-a2935f783f38
                  value: Hilton
                  category: Payee
                  idExternal: InvcNbr1234
                  note: Invoice
                  sequence: 62321-1
