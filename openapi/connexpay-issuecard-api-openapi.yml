  /api/v1/IssueCard/{cardGuid}:
    put:
      summary: Update Card
      description: ''
      operationId: updatecard
      parameters:
      - name: Content-Type
        in: header
        description: Content-Type Header
        schema:
          type: string
          default: '"application/json"'
      - name: CardGuid
        in: path
        description: Global Unique Identififer for the Card.
        schema:
          type: string
        required: true
      - name: Authorization
        in: header
        description: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
        schema:
          type: string
          default: Bearer Token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                PurchaseType:
                  type: string
                  description: 'Security Control: The industry(s) where a virtual card can be used. For example, if value is set to 01 Airline and the card is attempted to be used at a hotel, it will decline. Allowed purchase types are decided during underwriting. Ask a ConnexPay team member for Purchase Types enabled on your account. Best Practice is to always assign a Purchase Type that is restrictive as possible.'
                UsageLimit:
                  type: integer
                  description: 'Security Control: Maximum number of times the card may be authorized. The maximum allowed field value is 99, and if you do not provide a value the card will be considered unlimited. The exception to this are UATP cards, which have a maximum allowed value of 9999 and will default to that max if no value is provided.

                    Authorization attempts exceeding the provided value will be declined. Even though a virtual card is often considered a “one-time-use” card, some suppliers may need to authorize a card multiple times (pre-authorizations, a purchase comprised of multiple tickets, etc.) and you may consider a value that is not overly restrictive to avoid unwanted declines.'
                  format: int32
                Activated:
                  type: boolean
                  description: True activates a card from an inactive state. False suspends a card that is currently active.
                AssociationId:
                  type: string
                  description: 'Utilize the Association ID field to tie a virtual card to a sale or sales. For example, if you have several sales and one virtual card payment to a supplier, you can add association ID to the sales and the virtual card for downstream reporting. The maximum length is 100 alphanumeric characters and the following special characters: [@._/-].'
                TerminateDate:
                  type: string
                  description: The TerminateDate (YYYY-MM-DD format) is the date the Virtual Credit Card will be terminated by ConnexPay. TerminateDate is different than ExpirationDate in that TerminateDate indicates the actual date the card will no longer be active.  The recommendation is to set the ExpirationDate one or two years in the future and set the TerminateDate just a day or two after the VCC is expected to be processed. If a terminate date is not indicated, the card will be inactivated as of the expiration date. Note, Returns can still be processed on terminated VCCs and UATP termination dates cannot exceed 12 months.
                  format: date
                AmountLimit:
                  type: number
                  description: 'Security Control: Maximum dollar amount the card can be authorized and settled, which must be less than or equal to $5,000,000.00 (750,000CAD for Canadian Issuing clients). The value must incorporate any anticipated overages such as currency conversion or taxes that a supplier may associate with the transaction. If a supplier attempts to authorize a card for more than the amount limit it will be declined.'
                  format: float
                UserDefinedParameters:
                  type: array
                  description: You can replace the User Defined Parameters of your PayOut in the event that you need to associate or display additional information.
                  items:
                    properties:
                      Name:
                        type: string
                        description: Name of the User Defined Parameter.
                      Value:
                        type: string
                        description: 'Value for the named User Defined Parameter, in a format consistent with the defined DataType. If the User Defined Parameter is of Data Type String, the value is constrained by the defined Maximum Length and alphanumerics and special characters are allowed. If the User Defined Parameter is of Data Type DateTime, the formats accepted are ISO 8601 Formats (example: YYYY-MM-DD:HH:mm:ss), MM/DD/YYYY, and DD/MM/YYYY.'
                    type: object
                CustomerId:
                  type: string
                  description: 'Transaction ID within client environment associated with the customer. This value acts as a secondary identifier in conjunction with OrderNumber. The value is searchable and reportable in the ConnexPay portal. This value may be sent in multiple times within the integration for multiple purposes. The maximum length is 100 alphanumeric characters and the following special characters: [@._/-].'
                avsCheck:
                  type: boolean
                  description: 'Optional field that will default to your client-level setting if not provided. If enabled, Address Line 1 and Zip Code must be provided. '
            examples:
              Update PuchaseType Example Request:
                value:
                  PurchaseType: '01'
                  UsageLimit: 10
                  AssociationId: Test 1
                  TerminateDate: '2027-12-30'
                summary: Update PuchaseType Example Request
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Update PuchaseType Example Response:
                  value:
                    card:
                      cardGuid: 22724a6c-bf3e-409b-9593-c74648506aa7
                      amountLimit: 13
                      usageLimit: 22
                      limitWindow: LIFETIME
                      expirationDate: '2026-12-19T00:00:00'
                      expiration: '1222'
                      firstSix: '499999'
                      lastFour: '7354'
                      nameLine1: Jim
                      nameLine2: Rayeek
                      status: Card - Active
                      cardType: Visa
                      associationId: Test
                      clientProgram: '31'
                    mccGroupName: Hotels and Resorts
                  summary: Update PuchaseType Example Response
              schema:
                type: object
                properties:
                  card:
                    type: object
                    properties:
                      cardGuid:
                        type: string
                        example: 22724a6c-bf3e-409b-9593-c74648506aa7
                      amountLimit:
                        type: integer
                        example: 13
                        default: 0
                      usageLimit:
                        type: integer
                        example: 22
                        default: 0
                      limitWindow:
                        type: string
                        example: LIFETIME
                      expirationDate:
                        type: string
                        example: '2022-12-19T00:00:00'
                      expiration:
                        type: string
                        example: '1222'
                      firstSix:
                        type: string
                        example: '499999'
                      lastFour:
                        type: string
                        example: '7354'
                      nameLine1:
                        type: string
                        example: Jim
                      nameLine2:
                        type: string
                        example: Rayeek
                      status:
                        type: string
                        example: Card - Active
                      cardType:
                        type: string
                        example: Visa
                      associationId:
                        type: string
                        example: Test
                      clientProgram:
                        type: string
                        example: '31'
                  mccGroupName:
                    type: string
                    example: Hotels and Resorts
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - IssueCard
