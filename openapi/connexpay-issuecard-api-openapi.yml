  /api/v1/IssueCard/SendPaymentInfo/{cardGuid}:
    put:
      summary: Resend Transmission
      description: This endpoint resends payment information to recipient. Or returns a URL you can use within your application to direct a user to a visual representation of the virtual card.
      operationId: resendtransmission
      parameters:
      - name: Content-Type
        in: header
        description: Content-Type Header
        schema:
          type: string
          default: '"application/json"'
      - name: CardGuid
        in: path
        description: Global Unique Identififer for the Card.
        schema:
          type: string
        required: true
      - name: Authorization
        in: header
        description: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
        schema:
          type: string
          default: Bearer Token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - TransmissionMethods
              properties:
                TransmissionMethods:
                  type: array
                  description: 'Methods of Transmission. Supported methods: Email, Link, Fax. Populate this parameter as ''Email'' if you want to email the virtual card to a customer or supplier. Use the ''Link'' option to have a URL included in the response.  Use the "Fax" option to fax the virtual card to a customer or supplier.'
                  items:
                    type: string
                EmailRecipient:
                  type: string
                  description: Mandatory when transmission is Email. Otherwise don't include. This is the email address of the intended recipient. 255 char max.
                MerchantPhoneNumber:
                  type: string
                  description: This is the phone number that should display on the virtual card and is the number that should be used if the link has expired. Up to 15 characters. Numbers and plus sign (+) allowed only.
                EmailFrom:
                  type: string
                  description: For email transmissions, this will be the email address that populates the ‘reply to’ section of the email message. Do not include this parameter on other transmission method types. 255 char max.
                RecipientName:
                  type: string
                  description: A descriptive name of the email or fax recipient. Does not apply to the Link transmission method type. 255 char max
                Subject:
                  type: string
                  description: High-level subject line description of the transmission contents. Does not apply to the Link transmission method type. 255 char max.
                Message:
                  type: string
                  description: The message body of the email or fax. Does not apply to the Link transmission method type. 2048 char max.
                DaysToExpire:
                  type: integer
                  description: 'The number of days after card issuance until the link to the VC expires. Range: 1-999 days.'
                  format: int32
                EmailTemplateName:
                  type: string
                  description: Use a previously created custom email template by referring to the defined template name. 500 character max.
                FaxFrom:
                  type: string
                  description: Mandatory for fax transmission. This can be the client name or fax number the fax is coming from that populates the ‘FaxFrom’ section of the fax. 255 char max.
                FaxRecipient:
                  type: string
                  description: Mandatory for fax transmissions.  The fax number of the intended recipient.
            examples:
              Resend Transmission Request Example - email:
                value:
                  TransmissionMethods:
                  - Email
                  EmailRecipient: emailTo@gmail.com
                  MerchantPhoneNumber: '+7411237489'
                  EmailFrom: emailFrom@gmail.com
                  RecipientName: Smith
                  Subject: Card Information
                  Message: here is your card information...
                  DaysToExpire: 1
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Resend Transmission Response Example:
                  value: "{\n    \"linkToCard\": \"https://sandboxpurchasesapi.connexpay.com//cards?token=eyJhbGciOiJodHRwOi8vd3d3LnczLm9yZy8yMDAxLzA0L3htbGRzaWctbW9yZSNobWFjLXNoYTI1NiIsInR5cCI6IkpXVCJ9.eyJDYXJkR3VpZCI6IjBmZTI4M2MwLTc2MjYtNGVhNS1iMWUwLTc1MTNkMjk3MTY1YiIsIk1lcmNoYW50UGhvbmUiOiI1MTYyNTMyMjIyIiwibmJmIjoxNjE5NjA2NzY0LCJleHAiOjE2MTk2OTMxNjQsImlhdCI6MTYxOTYwNjc2NCwiaXNzIjoiaHR0cHM6Ly9QdXJjaGFzZXMuY29ubmV4cGF5LmNvbS8iLCJhdWQiOiJNZXJjaGFudHMifQ.QKoqNWksbvq4VUzArS0dCeG67rFOPZb8k8Yvj11eF2c\"\n}"
              schema:
