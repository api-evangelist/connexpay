                value:
                  UsageLimit: 100
                  AmountLimit: 1004
                  LimitWindow: MONTH
                  PurchaseType: '01'
                  MIDWhiteList:
                  - '1210000163087898'
                  - '1210000163083578'
                  MIDBlackList:
                  - '1210000163083918'
                  Activated: true
      responses:
