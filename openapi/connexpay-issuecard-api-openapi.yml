  /api/v1/IssueCard/PhysicalCard:
    post:
      summary: Issue Physical Card
      description: Use this endpoint to create a Physical Card. Issuing Physical Cards requires approval and set up. Please contact your Client Success representative if you're interested in learning more.
      operationId: issue-physical-card
      parameters:
      - name: Content-Type
        in: header
        description: '"application/json"'
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'Token. Eg: "Bearer eHSN5rTBzqDozgAAlN1UlTMVuIT1zSiAZWCo6E..."'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - AmountLimit
              - PhysicalCardFulfillment
              - MerchantGuid
              - Country
              - FirstName
              - LastName
              - Address1
              - City
              - State
              - ZipCode
              - DateOfBirth
              - LimitWindow
              properties:
                MerchantGuid:
                  type: string
                  description: Merchant's guid. Application level value that indicates a physical card is being requested for clients account. Value provided by ConnexPay.
                FirstName:
                  type: string
                  description: Cardholder's first name. This is the first name placed on the physical card. The value is also searchable in the Bridge. The total length of the combined FirstName and LastName fields cannot exceed 25 characters.
                LastName:
                  type: string
                  description: Cardholder's last name. This is the last name placed on the physical card. The value is also searchable in Bridge. The total length of the combined FirstName and LastName fields cannot exceed 25 characters.
                Phone:
                  type: integer
                  description: Cardholder's phone number.  Phone number up to 20 character string.
                  format: int32
                Address1:
                  type: string
                  description: Cardholder's address line 1.  Alphanumeric.
                Address2:
                  type: string
                  description: Cardholder's address line 2.  Alphanumeric.
                City:
                  type: string
                  description: Cardholder's city.
                State:
                  type: string
                  description: Cardholder's short name state.  The ISO 3166-2 CA and US state or province code of a user. Length = 2. If a non U.S. or Canadian value is submitted the card request will not be processed and an error response returned.
                Country:
                  type: string
                  description: Cardholder's country.  Only alpha-2 digit country code allowed and numbers are not allowed.  See ISO-3166 country list of Alpha-2 country codes (https://www.iso.org/obp/ui/) .
                ZipCode:
                  type: string
                  description: Cardholder's zipcode.  The Zipcode must be between 1 and 10 characters long, Only numbers and letters are allowed.
                DateOfBirth:
                  type: string
                  description: Cardholder's date of birth in ISO 8601 format.
                  format: date
                AmountLimit:
                  type: number
                  description: 'Security Control: Maximum dollar amount the card can be authorized and settled, which must be less than or equal to $4,999,999.99. The value must incorporate any anticipated overages such as currency conversion or taxes that a supplier may associate with the transaction. Once the amount limit has been reached, any future authorizations will be declined.'
                  format: float
                UsageLimit:
                  type: integer
                  description: 'Security Control: Maximum number of times the card may be authorized. If you do not provide a usage limit, the card will be considered unlimited.'
                  format: int64
                LimitWindow:
                  type: string
                  description: 'Time period for the spending limits. Valid values: ''Daily'', ''Weekly'', and ''Monthly''. Defines how the amountLimit and usageLimit are reset.'
                  enum:
                  - Daily
                  - Weekly
                  - Monthly
                IncomingTransactionCode:
                  type: string
                  description: Internal transaction code for associating the card with a specific sale or transaction.
                SaleGuid:
                  type: string
                  description: Only applicable when tied to an incoming Sale; globally unique identifier for the linked sale. Null values and field not present are supported.
                OutcomingTransactionCode:
                  type: string
                  description: '"Outgoing transaction code for tracking purposes.'
                PurchaseType:
                  type: string
                  description: 'Security Control: The industry where the virtual card will be utilized. For example, if value set to airline and the card is used at hotel, it will be declined. Available purchase type values are: ''01'' (Airline), ''02'' (Hotels and Resorts), ''03'' (Car Rental), ''04'' (Cable, Satellite, Television, and Radio Services), ''05'' (Cruise Lines), ''06'' (Travel), ''11'' (Medical Services and Health Practitioners), ''21'' (Advertising Services), ''22'' (Misc Advertising and Business Services), ''23'' (Ticketing), ''31'' (Insurance Sales, Underwriting, and Premiums), ''32'' (Insurance and Real Estate Codes), ''91'' (Restaurants and Food Services), and ''93'' (Tax Payments). Required if MidWhitelist not provided.'
                PayeeId:
                  type: string
                  description: The PayeeId is used to assist with Intelligent Routing functionality. This field was previously labeled as the Supplier ID and serves the same purpose for Intelligent Routing; however, it also supports additional functionality if a Payee has been created. Creating a Payee allows you complete control over the type of virtual card used to pay your payee and minimizes the data that must be passed in each card request. The field accepts up to 100 alpha-numeric characters, special characters, and spaces. Reference our MerchantPayees APIs for additional details.
                Transmission:
                  type: object
                  properties:
                    TransmissionMethods:
                      type: array
                      items:
                        type: string
                      description: 'Supported methods: Link. Use the ''Link'' option to have a URL included in the response.'
                  description: 'Transmission settings for physical cards. Note: Email or fax transmission methods are not valid for physical cards as they must be shipped via mail.'
                SequenceNumber:
                  type: string
                  description: 'Transaction sequence number within client environment. Provide a unique SequenceNumber for each new request. If a card request is made with all the same parameter information and the same sequence number, within 30 minutes, the request will be considered a duplicate and a new card will not be issued. Note: value is not searchable or reportable in Bridge. The maximum length is 100 alpha-numeric characters.'
                AvsCheck:
                  type: boolean
                  description: Enable Address Verification System (AVS) check. When enabled, the address must match the billing address for authorization. Defaults to your client-level setting when not provided.
                TerminateDate:
                  type: string
                  description: 'Date when the card should be automatically terminated. Cannot be set to a date beyond one year from current date. Format: ISO 8601.'
                  format: date-time
                ActivationDate:
                  type: string
                  description: Date when the card should be automatically activated. For delayed activation scenarios.
                  format: date-time
                OrderNumber:
                  type: string
                  description: 'A value that is commonly used for reporting on and reconciling your PayIns and PayOuts. The Order Number is searchable in the ConnexPay Bridge and referenced in Analytics and reporting, and can be any identifier within your environment to associate with the sale or payment, such as a Record Locator, PNR, or transaction ID. The maximum length is 50 alpha-numeric characters and allows the following special characters: [._ /- ].'
                CustomerID:
                  type: string
                  description: 'Transaction ID within client environment associated with the customer. This value acts as a secondary identifier in conjunction with OrderNumber. The value is searchable and reportable in the ConnexPay portal. This value may be sent in multiple times within the integration for multiple purposes. The maximum length is 100 alphanumeric characters and the following special characters: [@._/-]. The maximum length is 50 characters and is alpha-numeric.'
                MidWhitelist:
                  type: string
                  description: List of Merchant IDs (MIDs) that are allowed. Only transactions at these merchants will be authorized. Required if PurchaseType not provided.
                MidBlacklist:
                  type: string
                  description: List of Merchant IDs (MIDs) that are blocked. Transactions at these merchants will be declined.
                LabelIds:
                  type: integer
                  description: Utilize Label IDs to associate a virtual card to a specific label(s) within ConnexPay Bridge UI for your organization. If a virtual card is tied to an incorrect Label, it will not filter or display correctly in Bridge's Search Grid. Please contact your Customer Care Consultant for a list of valid Label IDs before use.
                CurrencyCode:
                  type: string
                  description: Currency of the stored balance of the issued physical card. If left blank or unprovided, the default is your Accounting Currency. See https://docs.connexpay.com/reference/currency-and-region-codes for valid codes.
