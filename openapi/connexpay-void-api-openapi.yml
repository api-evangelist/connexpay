                      '
                  sequenceNumber:
                    type: string
                    example: Sample-seq-1
                  sale:
                    type: object
                    properties:
                      guid:
                        type: string
                        example: bfff1a26-4207-4871-9597-48282e3fcfea
                      status:
                        type: string
                        example: Transaction - Approved
                      batchStatus:
                        type: string
                        example: Batch - Open
                      timeStamp:
                        type: string
                        example: '2017-07-11T11:05:24.65'
                      deviceGuid:
                        type: string
                        example: 8f65764d-72c1-4dee-ac9f-4cd4c98e8c35
                      amount:
                        type: number
                        example: 19.74
                        default: 0
                      effectiveAmount:
                        type: integer
                        example: 0
                        default: 0
                      orderNumber:
                        type: string
                        example: '11518'
                      orderDate:
                        type: string
                        example: '2017-02-03T00:00:00'
                      batchGuid:
                        type: string
                        example: 1564cb1b-eddb-4747-9565-61a7d7d225f9
                      processorStatusCode:
                        type: string
                        example: A0000
                      processorResponseMessage:
                        type: string
                        example: Success
                      wasProcessed:
                        type: boolean
                        example: true
                        default: true
                      authCode:
                        type: string
                        example: VTLMC1
                      refNumber:
                        type: string
                        example: '13283644'
                      invoiceNumber:
                        type: string
                        example: '11518'
                      customerReceipt:
