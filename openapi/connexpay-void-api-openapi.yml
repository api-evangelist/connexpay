                      customData:
                        type: string
                        example: order details
                      card:
                        type: object
                        properties:
                          first4:
                            type: string
                            example: '5306'
                          last4:
                            type: string
                            example: '0213'
                          cardNumber:
                            type: string
                            example: 1zcGT7J4pkGh0213
                          cardHolderName:
                            type: string
